<div class="login-content">
  <div class="login-form">
    <h2 class="login-title">Activer mon compte</h2>
    <p class="login-text">Renseignez votre matricule et votre adresse email. Un mot de passe provisoire vous sera envoyé par email et devra être changé à votre première connexion.</p>
    <br>
    <form [formGroup]="activationForm" (ngSubmit)="activate()">
      <div class="row g-3">
        <div class="col-sm-12">
          <label class="form-label" for="activation-matricule">Matricule</label>
          <input id="activation-matricule" type="text" class="form-control" placeholder="Saisir votre matricule" formControlName="matricule" autocomplete="username">
        </div>
        <div class="col-sm-12">
          <label class="form-label" for="activation-email">Adresse email</label>
          <input id="activation-email" type="email" class="form-control" placeholder="Saisir votre adresse email" formControlName="email" autocomplete="email">
        </div>
        <div class="col-md-12">
          <button class="w-100" id="button-login" type="submit" [disabled]="activationForm.invalid || isLoading">
            {{ isLoading ? 'Activation en cours...' : 'Activer mon compte' }}
          </button>
        </div>
        <div class="col-md-12">
          <button class="w-100" id="button-reset" type="button" [routerLink]="['/auth/login']">Annuler</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="panel-form" *ngIf="indicateur">
    <div class="panel-form-header mb-0">
        <div class="panel-form-text">
        <h3>Détails l'indicateur N° {{ indicateur.numero }}</h3>
        </div>
    </div>
    <div class="panel-list-body py-0" *ngIf="indicateur">
        <div class="row details py-3 g-3">
            <div class="col-lg-4 col-sm-6">
                <div class="details-item">
                    <span>Libelle</span>
                    <span>{{ indicateur.libelle }}</span>
                </div>
            </div>
            <div class="col-lg-4 col-sm-6">
                <div class="details-item">
                    <span>Responsable Activité</span>
                    <span>{{indicateur.responsableActivite }}</span>
                </div>
            </div>
            <div class="col-lg-4 col-sm-6">
                <div class="details-item">
                    <span>Date</span>
                    <span>{{ indicateur.date }}</span>
                </div>
            </div>
            <hr class="h-divider">
            <div class="col-lg-12">
                <div class="details-item">
                    <span>Divisions impliqués</span>
                    <ul class="badges">
                        <li class="badge-item" *ngFor="let item of indicateur.divisions">
                            {{ item.label }}
                        </li>
                    </ul>
                </div>
            </div>
        
            <hr class="h-divider">
            <div class="col-lg-12">
                <div class="details-item">
                    <span>Bureau impliqués</span>
                    <ul class="badges">
                        <li class="badge-item" *ngFor="let item of indicateur.bureaux">
                            {{ item.label }}
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <button type="button" class="button-return" (click)="goBack()">
            <i class="fa fa-arrow-left"></i>
            Retour</button>
    </div>
</div>

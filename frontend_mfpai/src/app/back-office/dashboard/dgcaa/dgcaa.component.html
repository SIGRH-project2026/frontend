<h3 class="my-3">Filter</h3>
<div class="panel-list-search">
    <div class="contents w-100">
        
        <div class="row  align-items-end">
            <div class="col-lg-4">
                <label class="form-label">Acte</label>
                <select class="form-select" [(ngModel)]="selectedActe" (change)="onActeChange()">
                    <option value="" selected>Sélectionner</option>
                    <option value="Acte Administratif">Acte d'administration</option>
                    <option value="Acte gestion">Acte de Gestion</option>

                </select>
            </div>
            <div class="col-lg-4">
                <label class="form-label">Type d'acte</label>
                <select class="form-select" [(ngModel)]="selectedTypeActe">
                    <option value="" [disabled]="!selectedActe" selected>Sélectionner</option>
                    <option *ngFor="let typeActe of actes" [value]="typeActe.code">{{ typeActe.libelle }}</option>
                </select>
            </div>
            <div class="col-lg-4">
                <button  [disabled]="!selectedTypeActe" class="button button-primary" (click)="filtrer()">Filtrer</button>
            </div>
        </div>
    </div>
</div>
<!-- <h3 class="my-3"> {{selectedActe}} {{selectedTypeActe}}</h3>
 --><div class="row g-3">
    <div class="col-md-3" *ngFor="let item of items">
        <div class="dashlet-item p-3" [ngClass]="getBackgroundColor(item.title)" (click)="redirect(item.path)">
            <div class="titreIcon-items d-flex justify-content-between align-items-center kus">
                <h3> {{item.title}}</h3>
                <div class="icon-items">
                    <i class="fa-solid fa-arrow-right" [ngStyle]="{'color': getIconColor(item.title)}"
                        ></i>
                </div>
            </div>
            <h1>{{item.count}}</h1>
            <p>{{item.statut}}</p>
        </div>
    </div>
</div>

<h3 class="my-3"></h3>

<div class="row g-3">
    <div class="col-md-3" *ngFor="let item of items" (click)="onItemClick(item.path, item.statutCode)">
        <div *ngIf="canUserSeeCen()" class="dashlet-item p-3" [ngClass]="getBackgroundColor(item.title)">
            <div class="titreIcon-items d-flex justify-content-between align-items-center">
                <h3>{{item.title}} {{item.canSeeDFCCentral}}</h3>
                <div class="icon-items">
                    <i class="fa-solid fa-arrow-right" [ngStyle]="{'color': getIconColor(item.title)}"></i>
                </div>
            </div>
            <h1>{{item.count}}</h1>
            <p>{{item.statut}}</p>
        </div>
        <div *ngIf="canUserSeeDec(item.title)" class="dashlet-item p-3" [ngClass]="getBackgroundColor(item.title)">
            <div class="titreIcon-items d-flex justify-content-between align-items-center">
                <h3>{{item.title}}</h3>
                <div class="icon-items">
                    <i class="fa-solid fa-arrow-right" [ngStyle]="{'color': getIconColor(item.title)}"></i>
                </div>
            </div>
            <h1>{{item.count}}</h1>
            <p>{{item.statut}}</p>
        </div>
    </div>
</div>

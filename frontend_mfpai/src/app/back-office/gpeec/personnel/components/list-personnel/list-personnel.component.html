<div class="panel-list mb-3">
    <div class="panel-list-header">
        <div class="panel-list-text">
            <h3>Rechercher</h3>
            <!-- <button class="button button-primary" type="button" (click)="onCreateUser()">
                <i class="fa fa-add"></i>
                Nouvel utilisateur
            </button> -->
        </div>
    </div>
    <div class="panel-list-body">
      <form [formGroup]="advancedSearchForm" *ngIf="profile !== 'Chef-etablissement'  && profile !== 'Chef-cfp' && profile !== 'Chef-EFF'">
        <!-- IA/Ministere -->
        <div class="row g-3" *ngIf="isDGPEEC">
            <div class="col-sm-6" >
                <label class="form-label form-label-sm">IA/Ministere</label>
                <select class="form-select" #typeStructureValue formControlName="structure" (change)="getStruct($any($event.target).value)">
                    <option value="">Sélectionner</option>
                    <option *ngFor="let struc of structure" [value]="struc?.code">{{struc?.label}}</option>

                </select>
            </div>
            <!-- Ministere -->
            <ng-container *ngIf="selectedOption === 'Ministere'">
                <div class="col-sm-6">
                    <label class="form-label form-label-sm">EFF</label>
                    <select class="form-select" formControlName="etablissement">
                        <option value="">Sélectionner</option>
                    </select>
                </div>
            </ng-container>

            <!-- IA -->
           <ng-container *ngIf="typeStructureValue.value === 'IA'">
            <label class="form-label form-label-sm">Région</label>
            <select class="form-select" formControlName="region"
                    (change)="getListIA($any($event.target).value)">
                <option value="">Sélectionner</option>
                <option *ngFor="let reg of region" [value]="reg.code">{{reg?.label}}</option>
            </select>
                <div class="col-sm-6">
                    <label class="form-label form-label-sm">IA</label>
                    <select class="form-select" formControlName="ia" (change)="getListEF($any($event.target).value);
                        getListEtabByIA($any($event.target).value)">
                            <option value="">Sélectionner</option>
                            <option *ngFor="let ie of ia" [value]="ie.code">{{ie?.label}}</option>
                    </select>
                </div>
                <div class="col-sm-6">
                    <label class="form-label form-label-sm">IEF</label>
                    <select class="form-select" formControlName="ief" (change)="
                            getListEtablissement($any($event.target).value);">
                           <option value="">Sélectionner</option>
                           <option *ngFor="let ie of ief" [value]="ie.code">{{ie?.label}}</option>
                       </select>
                </div>
                <div class="col-sm-6">
                    <label class="form-label form-label-sm">Etablissement</label>
                    <select class="form-select" formControlName="etablissement">
                        <option value="">Sélectionner</option>
                        <option *ngFor="let eta of etablissement" [value]="eta.code">{{eta?.label}}</option>
                    </select>
                </div>
           </ng-container>
           <ng-container *ngIf="typeStructureValue.value === 'MIN'">
            <div class="col-sm-4">
                <label class="form-label">EFF </label>
                <select class="form-select" formControlName="etablissement">
                    <option value="">Sélectionner</option>
                    <option *ngFor="let eta of etablissement" [value]="eta.code">{{eta?.code}}</option>
                </select>

            </div>
        </ng-container>

        </div>
        <div class="row g-3" *ngIf="!isDGPEEC">


            <!-- IA -->
           <ng-container>


                <div class="col-sm-6" *ngIf="profile === 'Representant-IA'">
                    <label class="form-label form-label-sm">IEF</label>
                    <select class="form-select" formControlName="ief" (change)="
                            getListEtablissement($any($event.target).value);">
                           <option value="">Sélectionner</option>
                           <option *ngFor="let ie of ief" [value]="ie.code">{{ie?.label}}</option>
                    </select>
                </div>

                <div class="col-sm-6">
                    <label class="form-label form-label-sm">Etablissement</label>
                    <select class="form-select" formControlName="etablissement">
                        <option value="">Sélectionner</option>
                        <option *ngFor="let eta of etablissement" [value]="eta.code">{{eta?.label}}</option>
                    </select>
                </div>
           </ng-container>


        </div>

        <!-- ACTIONS -->
        <div class="row g-3 mt-2">
            <div class="col-lg-2 col-sm-6">
                <button class="button button-secondary w-100" type="button" (click)="onSearchUser()">Rechercher</button>
            </div>
            <div class="col-lg-2 col-sm-6">
                <button class="button button-outline-primary w-100" (click)="onCancel()" type="reset">Annuler</button>
            </div>
        </div>
      </form>
    </div>
</div>


<ng-container>
<div class="panel-list">
    <div class="panel-list-header">
        <div class="panel-list-search">
            <div class="search">
                <div class="search-box">
                    <input class="search-input" type="text" placeholder="Rechercher"  [(ngModel)]="searchQuery">
                    <button class="search-btn"><i class="fas fa-search"></i></button>
                </div>
            </div>
        </div>
        <div class="panel-list-text">
        <h3>Résultat de recherche</h3>
        <button  (click)="exportToExcel()" type="button" class="button button-outline-green ms-3">
                            <img src="assets/icons/file-type-excel.svg" alt="Exporter le résultat" title="Exporter le résultat"
                                width="24px" >
                            Exporter le résultat</button>
        </div>
    </div>
    <div class="panel-list-body">
        <!-- Table -->
        <div class="table-responsive">
            <table class="table table-custom" id="dataTables">
                <thead>
                    <tr class="table-light">
                        <th scope="col" *ngFor="let head of headers">{{ head }}</th>
                    </tr>
                </thead>
                <tbody>
                    <ng-container *ngIf="userList.length > 0;else listEmpty;">
                        <tr *ngFor="let user of userList">
                            <ng-container *ngIf="matchSearchQuery(user)">
                            <td>
                                {{ user?.matricule }}
                            </td>
                            <td>
                                {{ user?.prenom }}
                            </td>
                            <td>
                                {{ user?.nom }}
                            </td>
                            <td>
                                {{ user?.corpsGrade?.label }}
                            </td>
                            <td>
                                {{ user?.grade?.label }}
                            </td>
                            <td>
                                {{ user?.speciality?.label }}
                            </td>
                            
                            <td>
                                <div class="dropdown">
                                    <button class="fab-button" type="button" data-bs-toggle="dropdown"
                                        aria-expanded="false">
                                        <i class="fa fa-ellipsis-v"></i>
                                    </button>
                                    <ul class="dropdown-menu">
                                        <li>
                                            <a class="dropdown-item" href="javascript:(0)" (click)="onViewUser(user)">
                                                <i class="fa fa-eye me-2"></i>
                                                <span>Voir détails</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </td>
                        </ng-container>
                        </tr>
                    </ng-container>
                    <ng-template #listEmpty>
                        <tr>
                            <td [attr.colspan]="headers.length">
                                <p class="text-black-50 text-center m-0">Aucune donnée disponible</p>
                            </td>
                        </tr>
                    </ng-template>
                </tbody>
            </table>
        </div>

        <!-- PAGINATION -->
        <div class="flex-row-between">
            <div class="d-flex align-items-center">
                <span style="white-space: nowrap">Affichage par</span>
                <select class="form-select form-select-sm mx-2 form-select-filter" [(ngModel)]="pageSize"
                    (ngModelChange)="listPersonnel()">
                    <option [ngValue]="10">10</option>
                    <option [ngValue]="20">20</option>
                    <option [ngValue]="30">30</option>
                </select>
                <span style="white-space: nowrap">entrées</span>
            </div>
            <ngb-pagination [collectionSize]="collectionSize" [(page)]="page" [pageSize]="pageSize"
                (pageChange)="listPersonnel()" [maxSize]="2" [rotate]="true" [boundaryLinks]="true">
            </ngb-pagination>
        </div>
    </div>
</div>
</ng-container>

<form [formGroup]="filiereDisciplinesForm">
<div class="panel-form">
    <div class="panel-form-header">
        <div class="panel-form-text w-100">
            <h3  *ngIf="typeFormation === 'filiere'">Ajout Filière/Discipline</h3>
            <h3  *ngIf="typeFormation === 'serie'">Ajout Série/Discipline</h3>
        </div>
    </div>
    <div class="panel-list-body py-0">

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="row g-4">
                    <span style="color: red;">{{filiereError}}</span>
                    <div class="col-lg-12"  *ngIf="typeFormation === 'serie'">
                        <label  class="form-label">Séries</label>
                        <select class="form-select" formControlName="serie" >
                            <option value="0">Sélectionner</option>
                            <option [value]="serie.id" *ngFor="let serie of series">{{
                                    serie?.libelle }}</option>
                        </select>
                    </div>
                    <div class="col-lg-12"  *ngIf="typeFormation === 'filiere'">
                        <label class="form-label">Filière</label>
                        <select formControlName="filiere" class="form-select">
                            <option value="">Sélectionner</option>
                            <option [value]="filiere.id" *ngFor="let filiere of listFilieres">{{filiere?.libelle}}</option>
                        </select>
                    </div>
                    <div class="col-lg-12" *ngIf="typeFormation === 'serie'">
                        <label class="form-label">Niveau</label>
                        <select  formControlName="niveau" class="form-select">
                            <option value="0">Sélectionner</option>
                            <option [value]="type.id" *ngFor="let type of niveauFST">{{
                                    type?.libelle }}
                            </option>
                        </select>
                    </div>
                    <div class="col-lg-12" *ngIf="typeFormation === 'filiere'">
                        <label class="form-label">Niveau</label>
                        <select  formControlName="niveau" class="form-select">
                            <option value="0">Sélectionner</option>
                            <option [value]="type.id" *ngFor="let type of niveauFPT">{{
                                    type?.libelle }}
                            </option>
                        </select>
                    </div>
                    <div class="col-lg-12">
                        <label class="form-label">Quantum horaire Filière</label>
                        <input formControlName="quantum" type="number" min="0" class="form-control" placeholder="Saisir" />
                    </div>
                    <span style="color: red;">{{disciplineError}}</span>
                    <div class="col-lg-12">
                        <label class="form-label d-block">Disciplines</label>
                        <select formControlName="disciplines" id="selectDisciplineFiliere" class="w-100" multiple title="Sélectionner..."
                            data-width="auto" data-live-search="true">
                            <option [value]="discipline" *ngFor="let discipline of listDisciplines">
                                {{ discipline?.libelle }}
                            </option>
                        </select>
                    </div>
                    <div class="col-lg-12">
                        <button  *ngIf="typeFormation === 'filiere'" type="button" class="button button-secondary w-100" (click)="addFiliereDiscipline()">Ajouter filière</button>
                        <button  *ngIf="typeFormation === 'serie'" type="button" class="button button-secondary w-100" (click)="addSerieeDiscipline()">Ajouter filière</button>

                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <!-- Table -->
                <div class="table-responsive">
                    <table class="table table-custom table-form w-100">
                        <thead>
                            <tr class="table-light">
                                <th scope="col" *ngFor="let head of headersDisciplines">{{ head }}</th>
                            </tr>
                        </thead>
                        <tbody>
                            <ng-container *ngIf="filiereDisciplines.length > 0;else listEmpty;">
                                <ng-container *ngFor="let filiere of filiereDisciplines ; let i = index">
                                    <tr>
                                        <td  *ngIf="typeFormation === 'filiere'" [attr.rowspan]="countRows2(filiere)">
                                            {{ filiere?.filiere?.libelle }}
                                        </td>
                                        <td  *ngIf="typeFormation === 'serie'" [attr.rowspan]="countRows2(filiere)">
                                            {{ filiere?.serie?.libelle }}
                                        </td>
                                        <td [attr.rowspan]="countRows2(filiere)">
                                            {{ filiere?.quantum }}
                                        </td>
                                    </tr>
                                    
                                    <ng-container *ngFor="let discipline of filiere.disciplineQuantums; let j = index">
                                        <tr>
                                            <td>
                                                {{ discipline?.discipline?.libelle }}
                                            </td>
                                            <td  *ngIf="typeFormation === 'serie'" >
                                                <input type="number" min="0"
                                                    [value]="discipline.quantum"
                                                    class="form-control form-control-sm" style="width: 100px;"
                                                    (change)="quatumsValues( true,i, j, $event)">
                                            </td>
                                            <td  *ngIf="typeFormation === 'filiere'" >
                                                <input type="number" min="0"
                                                    [value]="discipline.quantum"
                                                    class="form-control form-control-sm" style="width: 100px;"
                                                    (change)="quatumsValues( false,i, j, $event)">
                                            </td>
                                            <td>
                                                <button class="btn" type="button" (click)="onDelete(i, filiere.disciplineQuantums, discipline.discipline.id)"><i class="fa fa-trash text-danger"></i></button>
                                            </td>
                                        </tr>
                                    </ng-container>
                                </ng-container>

                            </ng-container>
                            <ng-template #listEmpty>
                                <tr>
                                    <td [attr.colspan]="headersDisciplines.length">
                                        <p class="text-black-50 text-center m-0">Aucune donnée disponible
                                        </p>
                                    </td>
                                </tr>
                            </ng-template>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="col-lg-12">
                <div class="action-steps">
                    <button *ngIf="typeFormation === 'serie'"  type="button" class="button button-primary" (click)="onSaveFiliere(true)">Enregistrer</button>
                    <button *ngIf="typeFormation === 'filiere'"  type="button" class="button button-primary" (click)="onSaveFiliere(false)">Enregistrer</button>

                    <button type="button" class="button button-light" (click)="onReset()">Annuler</button>
                </div>
            </div>
        </div>
    </div>
</div>
</form>

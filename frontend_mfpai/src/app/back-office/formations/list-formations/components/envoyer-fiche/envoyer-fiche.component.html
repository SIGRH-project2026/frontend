<div class="panel-form">
    <div class="panel-form-header mb-0">
        <div class="panel-form-text flex-column align-items-start w-100">
            <h3>Envoyer dossier candidature</h3>
            <ul class="panel-infos">
                <li>
                    <span>N° Référence : </span>
                    <span>lorem ipsum</span>
                </li>
                <li>
                    <span>Durée : </span>
                    <span>lorem ipsum</span>
                </li>
                <li>
                    <span>Période : </span>
                    <span>Du 20/02/2024 au 20/05/2024</span>
                </li>
            </ul>
        </div>
    </div>
    <div class="panel-list-body py-3">
        <form>
            <div class="row g-4">
                <div class="col-lg-12">
                    <label class="form-label">Pièces jointes <span class="text-danger fw-bold">*</span></label>
                    <ngx-dropzone (change)="onSelectFiles($event, piecesJointesFiles)">
                        <ngx-dropzone-label>
                            <i class="material-icons">cloud_upload</i>
                            <p class="fw-semibold">Sélectionner les fichiers</p>
                            <small>ou glisser et déposer les fichiers</small>
                        </ngx-dropzone-label>
                        <ngx-dropzone-preview *ngFor="let f of piecesJointesFiles" [removable]="true"
                            (removed)="onRemoveFile(f, piecesJointesFiles)">
                            <ngx-dropzone-label>{{ f.name }} ({{ f.type }})</ngx-dropzone-label>
                        </ngx-dropzone-preview>
                    </ngx-dropzone>
                </div>
            </div>
            <!-- ACTIONS -->
            <div class="row g-3 mt-2">
                <div class="col-lg-2 col-sm-6">
                    <button class="button button-primary w-100" type="button" (click)="onSaveDemande()">
                        Envoyer
                    </button>
                </div>
                <div class="col-lg-2 col-sm-6">
                    <button class="button button-outline-primary w-100" type="button" (click)="onReset()">
                        Annuler
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

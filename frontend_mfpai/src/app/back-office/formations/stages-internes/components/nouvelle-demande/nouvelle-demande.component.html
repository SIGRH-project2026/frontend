<div class="panel-list">
    <div class="panel-list-header">
        <div class="panel-list-text d-flex align-items-center justify-content-between">
            <h3>Nouvelle demande</h3>
        </div>
    </div>
    <div class="panel-list-body">
        <mat-stepper linear #stepper>
            <mat-step [stepControl]="infosBeneficiairesGroup">
                <form [formGroup]="demandeForm">
                    <ng-template matStepLabel>Informations personnelles</ng-template>
                    <div class="row g-4 mt-3">

                        <div class="col-lg-4 col-sm-6">
                            <label class="form-label">Prénom demandeur <span
                                    class="text-danger fw-bold">*</span></label>
                            <input type="text" class="form-control" formControlName="prenomDemandeur" placeholder="Saisir" />
                        </div>

                        <div class="col-lg-4 col-sm-6">
                            <label class="form-label">Nom demandeur <span class="text-danger fw-bold">*</span></label>
                            <input type="text" class="form-control" formControlName="nomDemandeur" placeholder="Saisir" />
                        </div>

                        <div class="col-lg-4 col-sm-6">
                            <label class="form-label">Date de naissance <span
                                    class="text-danger fw-bold">*</span></label>
                            <input type="date" class="form-control" formControlName="dateNaissance" placeholder="Saisir" />
                        </div>

                        <div class="col-lg-4 col-sm-6">
                            <label class="form-label">Lieu de naissance <span
                                    class="text-danger fw-bold">*</span></label>
                            <input type="text" class="form-control" formControlName="lieuDeNaissance" placeholder="Saisir" />
                        </div>

                        <div class="col-lg-4 col-sm-6">
                            <label class="form-label">Téléphone <span class="text-danger fw-bold">*</span></label>
                            <input class="form-control" [mask]="'00 000 00 00'" formControlName="tel" placeholder="Saisir" />
                        </div>

                        <div class="col-lg-4 col-sm-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" formControlName="mail" placeholder="Saisir" />
                        </div>

                        <div class="col-lg-4 col-sm-6">
                            <label class="form-label">Adresse</label>
                            <input type="text" class="form-control" formControlName="adresse" placeholder="Saisir" />
                        </div>

                        <div class="col-lg-12">
                            <label class="form-label">Objet de la demande <span
                                    class="text-danger fw-bold">*</span></label>
                            <textarea class="form-control" cols="30" formControlName="objet" rows="3" placeholder="Saisir"></textarea>
                        </div>
                    </div>

                    <div class="action-steps">
                        <button type="button" class="button button-light-red" (click)="onReset()">Annuler</button>
                        <button matStepperNext type="button" class="button button-primary text-white ">Suivant</button>
                    </div>
                </form>
            </mat-step>
            <mat-step [stepControl]="infosDemandeursGroup">
                <form [formGroup]="demandeForm" (ngSubmit)="onSaveDemande()" class="mt-5">
                    <ng-template matStepLabel>Informations de la demandes</ng-template>
                    <div class="row g-3">
                        <div class="col-lg-4 col-sm-6">
                            <label class="form-label">Niveau de scolarité <span class="text-danger fw-bold">*</span></label>
                            <select class="form-select"  formControlName="codeNiveauScolaire">
                                <option value="">Sélectionner</option>
                                <option *ngFor="let niveau of niveauScolarites" value="{{niveau.code}}">{{ niveau.libelle }}</option>
                            </select>
                        </div>
                        <div class="col-lg-4 col-sm-6">
                            <label class="form-label">Discipline de stage </label>
                            <input type="text" class="form-control" formControlName="disciplineStage" placeholder="Saisir" />
                        </div>

                        <div class="col-sm-4">
                            <label class="form-label">Service d’accueil</label>
                            <select class="form-select" formControlName="directionCode"  (change)="onSelectedDirection()">
                                <option value="">Sélectionner</option>
                                <option *ngFor="let direction of directions" value="{{direction.code}}">{{ direction.label }}</option>
                            </select>
                        </div>
                        <div class="col-sm-4" *ngIf="!isOk && !initOk">
                            <label class="form-label">Division</label>
                            <select class="form-select" formControlName="divisionCode" (change)="onSelectedDivision()">
                                <option value="">Sélectionner</option>
                                <option *ngFor="let division of divisions" value="{{division.code}}">{{ division.label }}</option>
                            </select>
                        </div>
                        <div class="col-sm-4" *ngIf="!isOk && !initOk">
                            <label class="form-label">Bureau</label>
                            <select class="form-select" formControlName="bureauCode">
                                <option value="">Sélectionner</option>
                                <option *ngFor="let bureau of bureaux" value="{{bureau.code}}">{{ bureau.label }}</option>
                            </select>
                        </div>

                        <div class="col-lg-4 col-sm-6">
                            <label class="form-label">Date début</label>
                            <input type="date" class="form-control" formControlName="dateDebut" placeholder="Saisir">
                        </div>

                        <div class="col-lg-4 col-sm-6">
                            <label class="form-label">Date fin</label>
                            <input type="date" class="form-control" formControlName="dateFin" placeholder="Saisir" />
                        </div>


                    </div>
                    <div class="row g-3">
                        <div class="col-lg-6">
                            <label class="form-label">Justificatifs <span class="text-danger fw-bold">*</span></label>
                            <ngx-dropzone (change)="onSelectFiles($event, piecesJointesFiles)">
                                <ngx-dropzone-label>
                                    <i class="material-icons">cloud_upload</i>
                                    <p class="fw-semibold">Sélectionner les fichiers</p>
                                    <small>ou glisser et déposer les fichiers</small>
                                </ngx-dropzone-label>
                                <ngx-dropzone-preview *ngFor="let f of piecesJointesFiles" [removable]="true"
                                                      (removed)="onRemoveFile(f, piecesJointesFiles)">
                                    <ngx-dropzone-label>{{ f.name }} ({{ f.type }})</ngx-dropzone-label>
                                </ngx-dropzone-preview>
                            </ngx-dropzone>
                        </div>
                        <div class="col-lg-6">
                            <label class="form-label">Commentaire</label>
                            <textarea class="form-control" formControlName="commentaire" cols="30" rows="7" placeholder="Saisir"></textarea>
                        </div>
                    </div>


                    <!-- Action buttons -->
                    <div class="action-steps">
                        <button type="button" class="button button-light-red" (click)="onReset()">Annuler</button>
                        <button matStepperPrevious type="button" class="button button-secondary">Précédent</button>
                        <button matStepperNext type="submit" class="button button-primary text-white">Enregistrer</button>
                    </div>
                </form>

            </mat-step>
        </mat-stepper>
    </div>
</div>

<div class="panel-form">
    <div class="panel-form-header">
        <div class="panel-form-text" *ngIf="demandeStage">
            <h3>Enregistrer attestation de stage N°{{ demandeStage.numero }}</h3>
        </div>
    </div>
    <div class="panel-list-body">
        <form *ngIf="demandeStage" [formGroup]="rapportStageForm">
            <div class="row g-3">
                <div class="col-sm-4">
                    <label class="form-label">Numéro</label>
                    <input type="text" class="form-control" value="{{demandeStage.numero}}" disabled />
                </div>
                <div class="col-sm-4">
                    <label class="form-label">Prénom Demandeur</label>
                    <input type="text" class="form-control" value="{{demandeStage.prenomDemandeur}}" disabled />
                </div>
                <div class="col-sm-4">
                    <label class="form-label">Nom Demandeur</label>
                    <input type="text" class="form-control" value="{{demandeStage.nomDemandeur}}" disabled />
                </div>
                <div class="col-sm-4">
                    <label class="form-label">Discipline de stage</label>
                    <input type="text" class="form-control" value="{{demandeStage.disciplineStage}}" disabled />
                </div>
                <div class="col-sm-4">
                    <label class="form-label">Date début</label>
                    <input type="text" class="form-control" value="{{demandeStage.dateDebut}}" disabled />
                </div>
                <div class="col-sm-4">
                    <label class="form-label">Date fin</label>
                    <input type="date" class="form-control" value="{{demandeStage.dateFin}}" disabled />
                </div>

                <div class="col-lg-12">
                    <div class="col-lg-12">
                        <label class="form-label">Pièce jointe</label>
                        <ngx-dropzone (change)="onSelectFiles($event, piecesJointeFile)" [multiple]="false">
                            <ngx-dropzone-label>
                                <i class="material-icons">cloud_upload</i>
                                <p class="fw-semibold">Sélectionner un fichier</p>
                                <small>ou glisser et déposer un fichier</small>
                            </ngx-dropzone-label>
                            <ngx-dropzone-preview [removable]="true" *ngIf="piecesJointeFile">
                                <ngx-dropzone-label>{{ piecesJointeFile.name }}</ngx-dropzone-label>
                            </ngx-dropzone-preview>
                        </ngx-dropzone>
                    </div>
                </div>
                <div class="col-lg-12">
                    <label class="form-label">Commentaire</label>
                    <textarea class="form-control" formControlName="commentaire" cols="30" rows="2" placeholder="Saisir"></textarea>
                </div>

            </div>
            <!-- ACTIONS -->
            <div class="row g-3 mt-2">
                <div class="col-lg-2 col-sm-6">
                    <button class="button button-primary w-100" type="button"
                        (click)="onSaveDemande()">Enregistrer</button>
                </div>
                <div class="col-lg-2 col-sm-6">
                    <button class="button button-outline-primary w-100" type="reset"
                        (click)="onReset()">Annuler</button>
                </div>
            </div>

        </form>
    </div>

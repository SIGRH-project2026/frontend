<nav class="navbar navbar-expand-lg ld-navbar">
    <div class="container">
        <a class="navbar-brand" href="#">
        <!-- <span class="logo-name">SIGRH</span> -->
        <img src="assets/icons/logo-ministere.svg" class="img-fluid logo" alt="SIGRH" title="SIGRH">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
            aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item" *ngFor="let menu of menuItems" [ngClass]="{ dropdown: menu.type === 'sub' }">
                    <a *ngIf="menu.type === 'link'" class="nav-link" [routerLink]="[menu.path]"
                        routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                        {{ menu.label }}
                    </a>
                    <a *ngIf="menu.type === 'sub'" class="nav-link dropdown-toggle" href="#" routerLinkActive="active" role="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                        {{ menu.label }}

                        <ul class="dropdown-menu">
                            <li *ngFor="let subMenu of menu.children">
                                <a class="dropdown-item" [routerLink]="[subMenu.path]" routerLinkActive="active">
                                    {{ subMenu.label }}
                                </a>
                            </li>
                        </ul>
                    </a>
                </li>
            </ul>
            <!-- Si l'utilisateur n'est pas connecté -->
            <ng-container *ngIf="!currentUser">
                <div class="buttons-group">
                    <button class="button button-primary rounded-pill" (click)="openBackoffice()">
                        Se connecter
                    </button>
                </div>
            </ng-container>

            <!-- Si l'utilisateur s'est connecté -->
            <ng-container>
                <div class="user-wrapper dropdown" *ngIf="currentUser">
                    <div class="user-avatar">
                        LD
                    </div>
                    <span class="user-content">
                        <span>Lamine DIEME</span>
                        <span>Adminstrateur</span>
                    </span>

                    <button class="dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    </button>
                    <ul class="dropdown-menu dropdown-menu-lg-end">
                        <li>
                            <a class="dropdown-item" [href]="backofficeUrl + '#/dashboard'">
                                <i class="fa fa-user-circle me-2"></i>
                                <span>Mon Espace</span>
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" (click)="onLogout()">
                                <i class="fa fa-sign-out-alt me-2"></i>
                                <span>Déconnexion</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </ng-container>
        </div>
    </div>
</nav>

<router-outlet></router-outlet>

<button id="btnScrollToTop" type="button" (click)="scrollToTop()">
    <i class="fa fa-up-long"></i>
</button>

<!-- Footer -->
<app-footer-portail></app-footer-portail>
